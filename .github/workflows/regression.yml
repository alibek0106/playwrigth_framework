name: Regression Tests

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    env: 
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }} 
      SAUCE_USER: ${{ secrets.SAUCE_USER }} 
      SAUCE_PASS: ${{ secrets.SAUCE_PASS }}
      REQRES_USER: ${{ secrets.REQRES_USER }}
      REQRES_PASS: ${{ secrets.REQRES_PASS }}
      REQRES_USER_NOPASS: ${{ secrets.REQRES_USER_NOPASS }}
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY}}
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install

      - name: Run Playwright tests
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always() # Run even if tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30