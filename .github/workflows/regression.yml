name: Regression Tests

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
        
      - name: Run Playwright tests
        run: pnpm exec playwright test
        # FIX 1: Indentation alignment
        env: 
          # FIX 2: Mapping Secrets to the EXACT names your code uses
          # Left side = Your Code (process.env.X). Right side = GitHub Secret.
          BASE_URL: ${{ secrets.BASE_URL }}
          
          # Ensure this matches what you used in apiFixtures.ts (API_URL or BASE_URL)
          API_URL: ${{ secrets.API_BASE_URL }} 
          
          # Code uses SAUCE_USER, Secret is SAUCE_USERNAME
          SAUCE_USER: ${{ secrets.SAUCE_USERNAME }} 
          SAUCE_PASS: ${{ secrets.SAUCE_PASS }}
          CI: true

      # FIX 3: Upload Report so you can debug failures
      - uses: actions/upload-artifact@v4
        if: always() # Run even if tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30